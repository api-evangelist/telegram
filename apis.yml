- aid: telegram:telegram-tdlib
  name: Telegram TDLib (Telegram Database Library)
  description: >-
    TDLib is a cross-platform, fully functional Telegram client library for third-party developers. TDLib
    takes care of all network implementation details, encryption and local data storage, allowing developers
    to build custom Telegram clients. It is open source, written in C++, and compatible with virtually
    any programming language through bindings.
  humanURL: https://core.telegram.org/tdlib
  baseURL: https://core.telegram.org/tdlib
