  /setChatDescription:
    post:
      operationId: setChatDescription
      summary: Set Chat Description
      description: Change the description of a group, a supergroup or a channel.
      tags:
        - Chat Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chat_id
              properties:
                chat_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: Unique identifier for the target chat
                description:
                  type: string
                  description: New chat description (0-255 characters)
      responses:
        '200':
          description: Chat description updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
  /pinChatMessage:
    post:
      operationId: pinChatMessage
      summary: Pin Chat Message
      description: Add a message to the list of pinned messages in a chat.
      tags:
        - Chat Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chat_id
                - message_id
              properties:
                chat_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: Unique identifier for the target chat
                message_id:
                  type: integer
                  description: Identifier of a message to pin
                disable_notification:
                  type: boolean
                  description: Pass true to notify all chat members silently
      responses:
        '200':
          description: Message pinned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
  /unpinChatMessage:
    post:
      operationId: unpinChatMessage
      summary: Unpin Chat Message
      description: Remove a message from the list of pinned messages in a chat.
      tags:
        - Chat Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chat_id
              properties:
                chat_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: Unique identifier for the target chat
                message_id:
                  type: integer
                  description: Identifier of a message to unpin
      responses:
        '200':
          description: Message unpinned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
  /exportChatInviteLink:
    post:
      operationId: exportChatInviteLink
      summary: Export Chat Invite Link
      description: Generate a new primary invite link for a chat.
      tags:
        - Invites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chat_id
              properties:
                chat_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: Unique identifier for the target chat
      responses:
        '200':
          description: New invite link as string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
  /createChatInviteLink:
    post:
      operationId: createChatInviteLink
      summary: Create Chat Invite Link
      description: Create an additional invite link for a chat.
      tags:
        - Invites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chat_id
              properties:
                chat_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: Unique identifier for the target chat
                name:
                  type: string
                  description: Invite link name (0-32 characters)
                expire_date:
                  type: integer
                  description: Point in time when the link will expire
                member_limit:
                  type: integer
                  description: Maximum number of users that can be chat members via this link
                creates_join_request:
                  type: boolean
                  description: True if users joining via this link need approval
