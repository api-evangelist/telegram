                $ref: '#/components/schemas/ChatInviteLinkResponse'
  /revokeChatInviteLink:
    post:
      operationId: revokeChatInviteLink
      summary: Revoke Chat Invite Link
      description: Revoke an invite link created by the bot.
      tags:
        - Invites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chat_id
                - invite_link
              properties:
                chat_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: Unique identifier for the target chat
                invite_link:
                  type: string
                  description: The invite link to revoke
      responses:
        '200':
          description: Revoked invite link object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInviteLinkResponse'
  /answerCallbackQuery:
    post:
      operationId: answerCallbackQuery
      summary: Answer Callback Query
      description: Send answers to callback queries sent from inline keyboards.
      tags:
        - Messaging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - callback_query_id
              properties:
                callback_query_id:
                  type: string
                  description: Unique identifier for the query to be answered
                text:
                  type: string
                  description: Text of the notification to display (0-200 characters)
                show_alert:
                  type: boolean
                  description: If true, alert instead of notification
                url:
                  type: string
                  description: URL to open upon button press
                cache_time:
                  type: integer
                  description: Maximum time in seconds for caching results (default 0)
      responses:
        '200':
          description: Callback query answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
  /setMyCommands:
    post:
      operationId: setMyCommands
      summary: Set My Commands
      description: Change the list of the bot commands.
      tags:
        - Bot Info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - commands
              properties:
                commands:
                  type: array
                  items:
                    $ref: '#/components/schemas/BotCommand'
                  description: List of bot commands (max 100)
                scope:
                  type: object
                  description: Scope of users for which the commands are relevant
                language_code:
                  type: string
                  description: Two-letter ISO 639-1 language code
      responses:
        '200':
          description: Commands set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
  /getMyCommands:
    post:
      operationId: getMyCommands
      summary: Get My Commands
      description: Get the current list of the bot commands.
      tags:
        - Bot Info
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: object
                  description: Scope of users for which commands are relevant
                language_code:
                  type: string
                  description: Two-letter ISO 639-1 language code
      responses:
        '200':
          description: Array of BotCommand objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCommandsResponse'
  /sendInvoice:
    post:
      operationId: sendInvoice
      summary: Send Invoice
      description: Send invoices.
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chat_id
                - title
                - description
                - payload
                - currency
                - prices
              properties:
                chat_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: Unique identifier for the target chat
                title:
                  type: string
                  description: Product name (1-32 characters)
                description:
                  type: string
                  description: Product description (1-255 characters)
                payload:
                  type: string
                  description: Bot-defined invoice payload (1-128 bytes)
                currency:
                  type: string
                  description: Three-letter ISO 4217 currency code
                prices:
                  type: array
                  items:
                    $ref: '#/components/schemas/LabeledPrice'
                  description: Price breakdown (list of components)
                provider_token:
                  type: string
                  description: Payment provider token (use empty string for Telegram Stars)
      responses:
        '200':
          description: Invoice message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /answerShippingQuery:
    post:
      operationId: answerShippingQuery
      summary: Answer Shipping Query
      description: Reply to shipping queries.
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipping_query_id
                - ok
              properties:
                shipping_query_id:
                  type: string
                  description: Unique identifier for the query to be answered
                ok:
                  type: boolean
                  description: Pass true if delivery to the specified address is possible
                shipping_options:
                  type: array
                  items:
                    type: object
                  description: Required if ok is true. Array of available shipping options
                error_message:
                  type: string
                  description: Required if ok is false. Error message
      responses:
        '200':
          description: Shipping query answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
  /answerPreCheckoutQuery:
    post:
      operationId: answerPreCheckoutQuery
      summary: Answer Pre-Checkout Query
      description: Respond to pre-checkout queries.
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pre_checkout_query_id
                - ok
              properties:
                pre_checkout_query_id:
                  type: string
                  description: Unique identifier for the query to be answered
                ok:
                  type: boolean
                  description: Specify true if everything is alright for the order to proceed
                error_message:
                  type: string
                  description: Required if ok is false. Error message
      responses:
        '200':
          description: Pre-checkout query answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
  /createNewStickerSet:
    post:
      operationId: createNewStickerSet
      summary: Create New Sticker Set
      description: Create a new sticker set owned by a user.
      tags:
        - Stickers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - name
                - title
                - stickers
              properties:
                user_id:
                  type: integer
                  description: User identifier of created sticker set owner
                name:
                  type: string
                  description: Short name of sticker set (1-64 characters)
                title:
                  type: string
                  description: Sticker set title (1-64 characters)
                stickers:
                  type: array
                  items:
                    type: object
                  description: List of 1-50 initial stickers to be added
                sticker_type:
                  type: string
                  enum: [regular, mask, custom_emoji]
                  description: Type of stickers in the set
      responses:
        '200':
          description: Sticker set created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
  /addStickerToSet:
    post:
      operationId: addStickerToSet
      summary: Add Sticker to Set
      description: Add a new sticker to a set created by the bot.
      tags:
        - Stickers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - name
                - sticker
              properties:
                user_id:
                  type: integer
                  description: User identifier of sticker set owner
                name:
                  type: string
                  description: Sticker set name
                sticker:
                  type: object
                  description: Sticker object with emoji list and optional keywords
      responses:
        '200':
          description: Sticker added to set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
components:
  securitySchemes:
    BotToken:
      type: apiKey
      in: path
      name: token
      description: Bot authentication token obtained from @BotFather (embedded in URL path)
  schemas:
    BooleanResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: boolean
    StringResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: string
    IntegerResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: integer
    MessageIdResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: object
          properties:
            message_id:
              type: integer
    UserResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/User'
    MessageResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/Message'
    UpdatesResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: array
          items:
            $ref: '#/components/schemas/Update'
    WebhookInfoResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/WebhookInfo'
    UserProfilePhotosResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/UserProfilePhotos'
    FileResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/File'
    ChatResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/Chat'
    ChatMembersResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
    ChatMemberResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/ChatMember'
    ChatInviteLinkResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/ChatInviteLink'
    BotCommandsResponse:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for this user or bot
        is_bot:
          type: boolean
          description: True if this user is a bot
        first_name:
          type: string
          description: User's or bot's first name
        last_name:
          type: string
          description: User's or bot's last name
        username:
          type: string
          description: User's or bot's username
        language_code:
          type: string
          description: IETF language tag of the user's language
        is_premium:
          type: boolean
          description: True if this user is a Telegram Premium user
      required:
        - id
        - is_bot
        - first_name
    Message:
      type: object
      properties:
        message_id:
          type: integer
          description: Unique message identifier inside a chat
        from:
          $ref: '#/components/schemas/User'
        chat:
          $ref: '#/components/schemas/Chat'
        date:
          type: integer
          description: Date the message was sent in Unix time
        text:
          type: string
          description: For text messages, the actual UTF-8 text of the message
        caption:
          type: string
          description: Caption for the animation, audio, document, photo, video or voice
      required:
        - message_id
        - date
        - chat
    Update:
      type: object
      properties:
        update_id:
          type: integer
          description: The update's unique identifier
        message:
          $ref: '#/components/schemas/Message'
        edited_message:
          $ref: '#/components/schemas/Message'
        callback_query:
          type: object
          description: New incoming callback query
      required:
        - update_id
    Chat:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for this chat
        type:
          type: string
          enum: [private, group, supergroup, channel]
          description: Type of chat
        title:
          type: string
          description: Title for supergroups, channels and group chats
        username:
          type: string
          description: Username for private chats, supergroups and channels
        first_name:
          type: string
          description: First name of the other party in a private chat
        last_name:
          type: string
          description: Last name of the other party in a private chat
        description:
          type: string
          description: Description for groups, supergroups and channel chats
        invite_link:
          type: string
          description: Primary invite link for the chat
        member_count:
          type: integer
          description: Number of members in a chat
      required:
        - id
        - type
    ChatMember:
      type: object
      properties:
        status:
          type: string
          enum: [creator, administrator, member, restricted, left, kicked]
          description: The member's status in the chat
        user:
          $ref: '#/components/schemas/User'
      required:
        - status
        - user
    ChatInviteLink:
      type: object
      properties:
        invite_link:
          type: string
          description: The invite link
        creator:
          $ref: '#/components/schemas/User'
        creates_join_request:
          type: boolean
          description: True if users joining via the link need to be approved
        is_primary:
          type: boolean
          description: True if the link is primary
        is_revoked:
          type: boolean
          description: True if the link is revoked
        name:
          type: string
          description: Invite link name
        expire_date:
          type: integer
          description: Point in time when the link will expire or has been expired
        member_limit:
          type: integer
          description: Maximum number of users that can be chat members
        pending_join_request_count:
          type: integer
          description: Number of pending join requests
      required:
        - invite_link
        - creator
        - creates_join_request
        - is_primary
        - is_revoked
    ChatPermissions:
      type: object
      properties:
        can_send_messages:
          type: boolean
          description: True if the user is allowed to send text messages
        can_send_audios:
          type: boolean
          description: True if the user is allowed to send audios
        can_send_documents:
          type: boolean
          description: True if the user is allowed to send documents
        can_send_photos:
          type: boolean
          description: True if the user is allowed to send photos
        can_send_videos:
          type: boolean
          description: True if the user is allowed to send videos
        can_send_polls:
          type: boolean
          description: True if the user is allowed to send polls
        can_send_other_messages:
          type: boolean
          description: True if the user is allowed to send animations, games, stickers
        can_add_web_page_previews:
          type: boolean
          description: True if the user is allowed to add web page previews to messages
        can_change_info:
          type: boolean
          description: True if the user is allowed to change chat title, photo and settings
        can_invite_users:
          type: boolean
          description: True if the user is allowed to invite new users to the chat
        can_pin_messages:
          type: boolean
          description: True if the user is allowed to pin messages
    WebhookInfo:
      type: object
      properties:
        url:
          type: string
          description: Webhook URL, may be empty if webhook is not set up
        has_custom_certificate:
          type: boolean
          description: True if a custom certificate was provided
        pending_update_count:
          type: integer
          description: Number of updates awaiting delivery
        ip_address:
          type: string
          description: Currently used webhook IP address
        last_error_date:
          type: integer
          description: Unix time for the most recent error
        last_error_message:
          type: string
          description: Error message in human-readable format for the most recent webhook error
        max_connections:
          type: integer
          description: Maximum allowed number of simultaneous HTTPS connections
        allowed_updates:
          type: array
          items:
            type: string
          description: List of update types the bot is subscribed to
      required:
        - url
        - has_custom_certificate
        - pending_update_count
    UserProfilePhotos:
      type: object
      properties:
        total_count:
          type: integer
          description: Total number of profile pictures the target user has
        photos:
          type: array
          items:
            type: array
            items:
              type: object
          description: Requested profile pictures (in up to 4 sizes each)
      required:
        - total_count
        - photos
    File:
      type: object
      properties:
        file_id:
          type: string
          description: Identifier for this file, which can be used to download or reuse the file
        file_unique_id:
          type: string
          description: Unique identifier for this file (stable across bots)
        file_size:
          type: integer
          description: File size in bytes
        file_path:
          type: string
          description: File path. Use https://api.telegram.org/file/bot<token>/<file_path> to get the file.
      required:
        - file_id
        - file_unique_id
    BotCommand:
      type: object
      properties:
        command:
          type: string
          description: Text of the command (1-32 characters, lowercase, no spaces)
        description:
          type: string
          description: Description of the command (3-256 characters)
      required:
        - command
        - description
    LabeledPrice:
      type: object
      properties:
        label:
          type: string
          description: Portion label
        amount:
          type: integer
          description: Price of the product in the smallest units of the currency
      required:
        - label
        - amount
