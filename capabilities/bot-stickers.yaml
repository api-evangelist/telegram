naftiko: 1.0.0-alpha2
info:
  label: Telegram Bot API — Stickers
  description: 'Telegram Bot API — Stickers. 2 operations. Lead operation: Add Sticker to Set. Self-contained Naftiko capability
    covering one Telegram business surface.'
  tags:
  - Telegram
  - Stickers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELEGRAM_API_KEY: TELEGRAM_API_KEY
capability:
  consumes:
  - type: http
    namespace: bot-stickers
    baseUri: https://api.telegram.org/bot{token}
    description: Telegram Bot API — Stickers business capability. Self-contained, no shared references.
    resources:
    - name: addStickerToSet
      path: /addStickerToSet
      operations:
      - name: addstickertoset
        method: POST
        description: Add Sticker to Set
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: createNewStickerSet
      path: /createNewStickerSet
      operations:
      - name: createnewstickerset
        method: POST
        description: Create New Sticker Set
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: token
      value: '{{env.TELEGRAM_API_KEY}}'
      placement: path
  exposes:
  - type: rest
    namespace: bot-stickers-rest
    port: 8080
    description: REST adapter for Telegram Bot API — Stickers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/addstickertoset
      name: addstickertoset
      description: REST surface for addStickerToSet.
      operations:
      - method: POST
        name: addstickertoset
        description: Add Sticker to Set
        call: bot-stickers.addstickertoset
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/createnewstickerset
      name: createnewstickerset
      description: REST surface for createNewStickerSet.
      operations:
      - method: POST
        name: createnewstickerset
        description: Create New Sticker Set
        call: bot-stickers.createnewstickerset
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bot-stickers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telegram Bot API — Stickers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: add-sticker-set
      description: Add Sticker to Set
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: bot-stickers.addstickertoset
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: create-new-sticker-set
      description: Create New Sticker Set
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: bot-stickers.createnewstickerset
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
