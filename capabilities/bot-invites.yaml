    resources:
    - path: /v1/createchatinvitelink
      name: createchatinvitelink
      description: REST surface for createChatInviteLink.
      operations:
      - method: POST
        name: createchatinvitelink
        description: Create Chat Invite Link
        call: bot-invites.createchatinvitelink
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
