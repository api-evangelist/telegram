naftiko: 1.0.0-alpha2
info:
  label: Telegram Bot API — Bot Info
  description: 'Telegram Bot API — Bot Info. 5 operations. Lead operation: Get File. Self-contained Naftiko capability covering
    one Telegram business surface.'
  tags:
  - Telegram
  - Bot Info
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELEGRAM_API_KEY: TELEGRAM_API_KEY
capability:
  consumes:
  - type: http
    namespace: bot-bot-info
    baseUri: https://api.telegram.org/bot{token}
    description: Telegram Bot API — Bot Info business capability. Self-contained, no shared references.
    resources:
    - name: getFile
      path: /getFile
      operations:
      - name: getfile
        method: POST
        description: Get File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: getMe
      path: /getMe
      operations:
      - name: getme
        method: POST
        description: Get Bot Info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: getMyCommands
      path: /getMyCommands
      operations:
      - name: getmycommands
        method: POST
        description: Get My Commands
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: getUserProfilePhotos
      path: /getUserProfilePhotos
      operations:
      - name: getuserprofilephotos
        method: POST
        description: Get User Profile Photos
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: setMyCommands
      path: /setMyCommands
      operations:
      - name: setmycommands
        method: POST
        description: Set My Commands
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: token
      value: '{{env.TELEGRAM_API_KEY}}'
      placement: path
  exposes:
  - type: rest
    namespace: bot-bot-info-rest
    port: 8080
    description: REST adapter for Telegram Bot API — Bot Info. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/getfile
      name: getfile
      description: REST surface for getFile.
      operations:
      - method: POST
        name: getfile
        description: Get File
        call: bot-bot-info.getfile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/getme
      name: getme
      description: REST surface for getMe.
      operations:
      - method: POST
        name: getme
        description: Get Bot Info
        call: bot-bot-info.getme
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/getmycommands
      name: getmycommands
      description: REST surface for getMyCommands.
      operations:
      - method: POST
        name: getmycommands
        description: Get My Commands
        call: bot-bot-info.getmycommands
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/getuserprofilephotos
      name: getuserprofilephotos
      description: REST surface for getUserProfilePhotos.
      operations:
      - method: POST
        name: getuserprofilephotos
        description: Get User Profile Photos
        call: bot-bot-info.getuserprofilephotos
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/setmycommands
      name: setmycommands
      description: REST surface for setMyCommands.
      operations:
      - method: POST
        name: setmycommands
        description: Set My Commands
        call: bot-bot-info.setmycommands
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bot-bot-info-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telegram Bot API — Bot Info. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-file
      description: Get File
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: bot-bot-info.getfile
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-bot-info
      description: Get Bot Info
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: bot-bot-info.getme
      outputParameters:
      - type: object
        mapping: $.
    - name: get-my-commands
      description: Get My Commands
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: bot-bot-info.getmycommands
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user-profile-photos
      description: Get User Profile Photos
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: bot-bot-info.getuserprofilephotos
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: set-my-commands
      description: Set My Commands
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: bot-bot-info.setmycommands
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
